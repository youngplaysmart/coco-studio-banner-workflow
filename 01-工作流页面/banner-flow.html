<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coco Studio · Banner 工作流</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F4F3F7; --canvas: #EFEEF3; --dot: #D3D1DA;
  --panel: #FFFFFF; --panel-2: #F5F4F8; --line: #E1DFE8; --line-strong: #C4C1CF;
  --text: #1C1B22; --muted: #66636F; --faint: #96939E;
  --accent: #6D4AE0; --accent-soft: rgba(109, 74, 224, .12); --on-accent: #FFFFFF;
  --ok: #24864A; --ok-soft: rgba(36, 134, 74, .12); --warn: #A86500; --warn-soft: rgba(168, 101, 0, .12); --danger: #C62828;
  --c-jira: #2563EB; --c-split: #6B6872; --c-prompt: #6D4AE0; --c-image: #0F8A7A; --c-compose: #B86E00;
  --edge: #ABA8B5; --shadow: 0 1px 2px rgba(28,27,34,.06), 0 8px 24px rgba(28,27,34,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111216; --canvas: #121318; --dot: #26272E;
    --panel: #1C1D22; --panel-2: #16171B; --line: #2C2D34; --line-strong: #43444D;
    --text: #EDEDF1; --muted: #9A9CA8; --faint: #6E707B;
    --accent: #B79CFF; --accent-soft: rgba(183, 156, 255, .14); --on-accent: #17121F;
    --ok: #6FD08C; --ok-soft: rgba(111, 208, 140, .14); --warn: #E9B860; --warn-soft: rgba(233, 184, 96, .14); --danger: #FF7A70;
    --c-jira: #6EA1FF; --c-split: #B3B0BC; --c-prompt: #B79CFF; --c-image: #4FD1BE; --c-compose: #F2B35B;
    --edge: #4C4D57; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111216; --canvas: #121318; --dot: #26272E;
  --panel: #1C1D22; --panel-2: #16171B; --line: #2C2D34; --line-strong: #43444D;
  --text: #EDEDF1; --muted: #9A9CA8; --faint: #6E707B;
  --accent: #B79CFF; --accent-soft: rgba(183, 156, 255, .14); --on-accent: #17121F;
  --ok: #6FD08C; --ok-soft: rgba(111, 208, 140, .14); --warn: #E9B860; --warn-soft: rgba(233, 184, 96, .14); --danger: #FF7A70;
  --c-jira: #6EA1FF; --c-split: #B3B0BC; --c-prompt: #B79CFF; --c-image: #4FD1BE; --c-compose: #F2B35B;
  --edge: #4C4D57; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 13px/1.55 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.i { width: 16px; height: 16px; flex: none; }

/* 顶栏 */
.top {
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 6;
}
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand { font-size: 17px; font-weight: 700; white-space: nowrap; }
.crumb { color: var(--faint); }
.proj { font-weight: 500; white-space: nowrap; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.file { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; min-width: 0; max-width: 460px; margin-left: 8px; }
.file label { color: var(--muted); white-space: nowrap; font-size: 12px; }
.file input { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
.file input[aria-invalid="true"] { border-color: var(--danger); }
.grow { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; white-space: nowrap;
}
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }

/* 舞台 */
.stage { position: relative; flex: 1; min-height: 0; }
#viewport {
  position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1.3px);
}
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.stage.moving .node { box-shadow: none; transition: none; }
/* 正在执行的卡片：高亮描边 + 呼吸光圈 */
.node[data-status="running"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 28px rgba(183, 156, 255, .35); }
@media (prefers-reduced-motion: no-preference) {
  .node[data-status="running"]::after { content: ""; position: absolute; inset: -6px; border-radius: 18px; border: 2px solid var(--accent); opacity: .5; animation: ring 1.4s ease-out infinite; pointer-events: none; }
  @keyframes ring { from { transform: scale(1); opacity: .55; } to { transform: scale(1.04); opacity: 0; } }
}
/* 工单分组框 */
#groups { position: absolute; left: 0; top: 0; }
.grp { position: absolute; left: 0; top: 0; border: 1.5px dashed var(--line-strong); border-radius: 18px; background: rgba(127, 127, 140, .04); pointer-events: none; }
.grp.running { border-color: var(--accent); border-style: solid; background: var(--accent-soft); }
.grp.err { border-color: var(--danger); }
.glabel { position: absolute; left: 14px; top: 8px; display: flex; align-items: center; gap: 8px; pointer-events: auto; cursor: grab; user-select: none; max-width: calc(100% - 28px); }
.glabel .gkey { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.glabel .gstat { font-size: 12px; color: var(--muted); white-space: nowrap; }
.grp.running .gstat { color: var(--accent); }
.glabel .gbtn { height: 26px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; white-space: nowrap; }
.glabel .gbtn:hover { border-color: var(--accent); color: var(--accent); }
/* 运行队列 */
.queue { position: absolute; left: 16px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 6; width: 340px; max-height: 46%; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.queue header { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 14px; }
.queue header b { font-size: 13px; }
.queue .qmeta { flex: 1; font-size: 11px; color: var(--muted); }
.queue .qbar { height: 4px; margin: 0 14px 8px; border-radius: 2px; background: var(--panel-2); overflow: hidden; }
.queue .qbar span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.queue ul { list-style: none; margin: 0; padding: 0 8px 8px; overflow: auto; }
.queue li { display: grid; grid-template-columns: 18px 1fr; gap: 0 8px; padding: 6px; border-radius: 8px; cursor: pointer; font-size: 12px; }
.queue li:hover { background: var(--panel-2); }
.queue .qi { grid-row: span 2; text-align: center; color: var(--muted); }
.queue .qt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.queue .qs { color: var(--muted); font-size: 11px; }
.queue .q-running .qi, .queue .q-running .qs { color: var(--accent); }
.queue .q-done .qi { color: var(--ok); }
.queue .q-error .qi, .queue .q-error .qs { color: var(--danger); }
.pinbtn.on { border-color: var(--c-image); color: var(--c-image); }
.autop { display: grid; gap: 8px; }
.autop .arow { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.autop .arow input[type=checkbox] { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--accent); }
.autop .arow b { display: block; font-size: 12px; }
.autop .arow small { display: block; font-size: 11px; color: var(--muted); }
.autop .arow.sub { align-items: center; font-size: 12px; margin-left: 26px; }
.autop .arow.info { cursor: default; background: var(--panel-2); }
.autop .acap { width: 60px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.pill.fresh { color: var(--on-accent); background: var(--accent); border-color: transparent; font-weight: 700; }
.node[data-status="waiting"] .badge { background: var(--warn-soft); color: var(--warn); }
.node[data-status="waiting"] { border-color: var(--warn); }
.editbox { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--warn); border-radius: 10px; background: var(--warn-soft); }
.editbox .etitle { font-weight: 700; font-size: 13px; }
.editbox .ehint { font-size: 11px; color: var(--muted); }
.editbox ol { margin: 0; padding-left: 18px; font-size: 12px; display: grid; gap: 2px; }
.editbox .editprompt { width: 100%; font-size: 12px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); resize: vertical; }
.editbox a.chipbtn { text-decoration: none; color: var(--text); }
.chipbtn.primary-chip { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.prog .pwait { font-size: 12px; color: var(--warn); }
.cocoset { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.cocomaster { width: 96px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); font-size: 12px; }
.cocorow { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); cursor: pointer; }
.cocorow input { width: 16px; height: 16px; accent-color: var(--accent); }
.cocorow img { width: 40px; height: 52px; object-fit: cover; border-radius: 6px; }
.cocorow b { display: block; font-size: 12px; }
.cocorow small { display: block; font-size: 11px; color: var(--muted); }
/* 清理 */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0,0,0,.45); padding: 16px; }
.mbox { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; }
.mbox h3 { margin: 0 0 8px; font-size: 16px; }
.mbox p { margin: 6px 0; color: var(--muted); font-size: 13px; }
.mact { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.btn.danger { background: var(--danger); color: #fff; }
.alignbar button.danger-txt { color: var(--danger); }
.grp.done { border-color: var(--ok); border-style: solid; }
.glabel .gclean { display: none; color: var(--danger); }
.grp.done .glabel .gclean { display: inline-block; }
.pill.done { color: var(--ok); border-color: currentColor; background: transparent; text-decoration: none; }
.board .gen.again { background: transparent; color: var(--accent); }
/* 生成进度 */
.prog { margin: 4px 18px 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent-soft); display: grid; gap: 8px; }
.prog.fin { border-color: var(--ok); background: var(--ok-soft); }
.prog.bad { border-color: var(--danger); background: transparent; }
.prog .ptop { display: flex; align-items: center; gap: 8px; }
.prog .ptop b { font-size: 14px; }
.prog .pt { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
.prog .pbar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.prog .pbar span { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.prog .pnow { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog .pmeta { font-size: 11px; color: var(--muted); }
.prog .pacts { display: flex; flex-wrap: wrap; gap: 6px; }
.prog a.chipbtn { text-decoration: none; color: var(--text); }
.prog .pico svg { width: 18px; height: 18px; color: var(--ok); }
.prog.bad .pico svg { color: var(--danger); }
.prog .perr { margin: 0; padding-left: 16px; font-size: 11px; color: var(--danger); display: grid; gap: 2px; }
.linkbtn { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
#viewport { cursor: default; }
#viewport.hand { cursor: grab; }
#viewport.hand.panning, #viewport.panning { cursor: grabbing; }
#viewport.hand .node { pointer-events: none; }
#marquee { position: absolute; left: 0; top: 0; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 2px; pointer-events: none; z-index: 3; }
#guides { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#guides line { stroke: #FF5DA2; }
.alignbar {
  position: absolute; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 5;
  display: flex; align-items: center; gap: 2px; padding: 5px 6px; background: var(--panel); border: 1px solid var(--accent);
  border-radius: 10px; box-shadow: var(--shadow); white-space: nowrap;
}
.alignbar #selCount { font-size: 12px; color: var(--accent); padding: 0 6px; font-weight: 600; }
.alignbar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.alignbar button { height: 30px; min-width: 30px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; border-radius: 7px; color: var(--text); padding: 0 6px; font-size: 12px; }
.alignbar button:hover:not(:disabled) { background: var(--panel-2); }
.alignbar button:disabled { opacity: .35; cursor: default; }
.tools button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
/* 拖动或平移过程中禁止选中文字 */
body.gesturing, body.gesturing * { user-select: none !important; -webkit-user-select: none !important; }
/* 卡片上的标题、标签、按钮文字不可选；输入框和需求原文仍可选中复制 */
.node { user-select: none; -webkit-user-select: none; }
.node input, .node textarea, .node pre, .node .derr, .node .diag { user-select: text; -webkit-user-select: text; }
body.gesturing .node, body.gesturing #viewport { cursor: grabbing !important; }
.stage.moving #edges path.edge { pointer-events: none; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edges path.edge { fill: none; stroke: var(--edge); stroke-width: 2; pointer-events: stroke; cursor: pointer; }
#edges path.edge:hover, #edges path.edge.sel { stroke: var(--accent); stroke-width: 3; }
#edges path.temp { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; }

/* 浮层：步骤条 */
.steps {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5;
  display: flex; align-items: center; gap: 14px; padding: 10px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
}
.step { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.step .dot {
  width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
}
.step.done .dot { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.step.now .dot { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.step b { display: block; font-size: 13px; font-weight: 600; }
.step small { display: block; font-size: 11px; color: var(--muted); }
.step.todo b { color: var(--muted); }
.steps .arrow { color: var(--faint); }

/* 浮层：确认面板 */
.confirm {
  position: absolute; top: 16px; right: 16px; z-index: 5; width: 320px; max-height: calc(100% - 120px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
.confirm header { display: flex; align-items: center; gap: 10px; padding: 16px 16px 4px 18px; }
.confirm header h2 { margin: 0; font-size: 17px; flex: 1; }
.confirm header .i { color: var(--ok); width: 20px; height: 20px; }
.confirm .sub { margin: 0; padding: 0 18px 12px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
.confirm dl { margin: 0; padding: 8px 18px; display: grid; grid-template-columns: 86px 1fr; gap: 12px 10px; }
.confirm dt { color: var(--muted); }
.confirm dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.confirm dd.warn { color: var(--warn); }
.confirm dd.ok { color: var(--ok); }
.confirm .act { padding: 8px 18px 16px; display: grid; gap: 8px; }
.confirm .go { height: 40px; justify-content: center; width: 100%; font-size: 14px; }
.confirm .why { color: var(--warn); font-size: 12px; }
.confirm .next { color: var(--faint); font-size: 11px; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: none; border-radius: 7px; color: var(--muted); }
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.reopen { position: absolute; top: 16px; right: 16px; z-index: 5; }

/* 浮层：底部工具栏 + 小地图 */
.tools {
  position: absolute; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 5;
  display: flex; align-items: center; gap: 2px; padding: 6px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.tools .sep { width: 1px; height: 24px; background: var(--line); margin: 0 6px; }
.tools button { height: 36px; min-width: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: none; border-radius: 8px; padding: 0 8px; color: var(--text); }
.tools button:hover:not(:disabled) { background: var(--panel-2); }
.tools button:disabled { opacity: .35; cursor: default; }
.tools output { min-width: 48px; text-align: center; color: var(--muted); font-size: 12px; }
.tip { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 5; font-size: 11px; color: var(--faint); white-space: nowrap; }
.mini {
  position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5; width: 210px; padding: 8px 10px 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.mini span { font-size: 11px; color: var(--muted); }
.mini svg { display: block; width: 100%; height: 100px; margin-top: 4px; cursor: pointer; }
.menu {
  position: absolute; bottom: calc(100% + 8px); left: 0; min-width: 220px; padding: 6px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.menu button { display: flex; width: 100%; height: auto; justify-content: flex-start; align-items: flex-start; gap: 10px; padding: 8px 10px; text-align: left; }
.menu small { display: block; color: var(--muted); font-size: 11px; }
.sw { width: 10px; height: 10px; border-radius: 3px; margin-top: 5px; flex: none; }
.lib {
  position: absolute; top: 12px; right: 20px; z-index: 7; width: 340px; max-height: 60vh; overflow: auto; padding: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.lib h3 { margin: 0 0 4px; font-size: 14px; display: flex; align-items: center; }
.lib h3 span { flex: 1; }
.lib p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
.lib li { list-style: none; padding: 8px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.lib ul { margin: 0; padding: 0; }
.lib .txt { font-size: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lib .row { display: flex; gap: 6px; }

.toast {
  position: absolute; left: 16px; top: 16px; z-index: 6; max-width: min(420px, calc(100% - 32px));
  padding: 10px 36px 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12px;
}
.toast.err { border-color: var(--danger); color: var(--danger); }
.toast button { position: absolute; right: 4px; top: 4px; }

/* 节点 */
.node {
  position: absolute; width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}

  </div>

</div>

<script>
(() => {
  // ---------- 常量 ----------
  const IC = {
    jira: '<path d="M6.5 9.5l3-3M5 7.5L3.6 8.9a2.5 2.5 0 003.5 3.5l1.4-1.4M11 8.5l1.4-1.4a2.5 2.5 0 00-3.5-3.5L7.5 5" stroke="currentColor" stroke-width="1.4" fill="none"/>',
    board: '<rect x="2" y="2.5" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M5 10.5V8M8 10.5V5.5M11 10.5V7" stroke="currentColor" stroke-width="1.6"/>',
    split: '<path d="M3 3h10M3 8h6M3 13h8" stroke="currentColor" stroke-width="1.5"/>',
    prompt: '<path d="M8 1.5l1.6 4.9 4.9 1.6-4.9 1.6L8 14.5 6.4 9.6 1.5 8l4.9-1.6z" stroke="currentColor" stroke-width="1.3" fill="none"/>',
    image: '<rect x="2" y="3" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.4" fill="none"/><circle cx="6" cy="6.5" r="1.2" fill="currentColor"/><path d="M3 12l3.5-3.5 2.5 2.5 2-2 2.5 2.5" stroke="currentColor" stroke-width="1.3" fill="none"/>',
    compose: '<path d="M2.5 5.5V2.5h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3" stroke="currentColor" stroke-width="1.4" fill="none"/>',
    run: '<path d="M4.5 3v10l8-5z" fill="currentColor"/>',
    runAll: '<path d="M2 3.5v9l5.5-4.5zM8.5 3.5v9l5.5-4.5z" fill="currentColor"/>',
    close: '<path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" fill="none"/>',
    check: '<path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="1.8" fill="none"/>',
  };
  const svg = (k, cls = "i") => `<svg class="${cls}" viewBox="0 0 16 16" aria-hidden="true">${IC[k]}</svg>`;
  const TYPES = {
    board:   { label: "Jira 工单看板", color: "var(--c-jira)",  hint: "统计、你负责的单、挑选生成", input: false },
    jira:    { label: "Jira 需求",   color: "var(--c-jira)",    hint: "读取需求与附件", input: true },
    split:   { label: "需求拆解",    color: "var(--c-split)",   hint: "Claude 拆出每张图", input: true },
    prompt:  { label: "画面提示词",  color: "var(--c-prompt)",  hint: "画面描述、文案和尺寸", input: true },
    image:   { label: "Figma 生图",  color: "var(--c-image)",   hint: "用 Figma AI 生成背景", input: true },
    compose: { label: "合成 Banner", color: "var(--c-compose)", hint: "套模板，叠可编辑文字", input: true },
  };
  const MODELS = ["gpt-image-2.5-flare", "gpt-image-2.5-sunburst", "gemini-3.1-flash-image", "gemini-3.1-flash-lite-image"];
  const STATUS = { idle: "待运行", running: "运行中", done: "已完成", stale: "需重跑", error: "出错了", waiting: "待改图" };

  // ---------- 状态 ----------
  const KEY = "coco-banner-flow-v2", LIBKEY = "coco-prompt-library-v1";
  let S = load(KEY) || blank();
  let view = { x: 80, y: 120, k: 1 };
  let selEdge = null, selNode = null, mcp = null, sample = null, cloudId = null;
  let ui = { confirmOpen: window.innerWidth > 640, startClosed: false };
  const els = new Map();
  let roRaf = 0;
  const ro = new ResizeObserver(() => { if (roRaf) return; roRaf = requestAnimationFrame(() => { roRaf = 0; updateEdges(); scheduleMini(); }); });

  function blank() { return { file: "", nodes: [], edges: [], seq: 1 }; }
  function load(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } }
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  let saveT = 0;
  function save() { clearTimeout(saveT); saveT = setTimeout(() => store(KEY, S), 300); refreshPanels(); refreshStart(); }
  const uid = (p) => p + (S.seq++);
  const byId = (id) => S.nodes.find((n) => n.id === id);
  const ups = (n) => S.edges.filter((e) => e.to === n.id).map((e) => byId(e.from)).filter(Boolean);
  const downs = (n) => S.edges.filter((e) => e.from === n.id).map((e) => byId(e.to)).filter(Boolean);
  const $ = (s) => document.querySelector(s);
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null) el.append(c);
    return el;
  }

  // ---------- 撤销 / 重做 ----------
  let past = [], future = [], snapT = 0, lastSnap = JSON.stringify(S);
  function snapshot(now) {
    clearTimeout(snapT);
    const take = () => {
      const cur = JSON.stringify(S);
      if (cur === lastSnap) return;
      past.push(lastSnap); if (past.length > 60) past.shift();
      future = []; lastSnap = cur; refreshUndo();
    };
    if (now) take(); else snapT = setTimeout(take, 500);
  }
  function restore(str) {
    for (const [, el] of els) { ro.unobserve(el.root); el.root.remove(); }
    els.clear();
    const file = S.file;
    S = JSON.parse(str); S.file = file;
    for (const n of S.nodes) { if (n.status === "running") n.status = "idle"; mountNode(n); }
    selNode = null; selSet.clear(); selEdge = null; lastSnap = str;
    drawEdges(); save(); refreshUndo();
  }
  function undo() { if (busy || !past.length) return; future.push(JSON.stringify(S)); restore(past.pop()); }
  function redo() { if (busy || !future.length) return; past.push(JSON.stringify(S)); restore(future.pop()); }
  function refreshUndo() { $("#undoBtn").disabled = !past.length || busy; $("#redoBtn").disabled = !future.length || busy; }

  // ---------- 工具 ----------
  function fileKey() {
    const v = (S.file || "").trim();
    const m = v.match(/figma\.com\/(?:design|file)\/(?:[^/]+\/branch\/)?([A-Za-z0-9]{22,128})/);
    if (m) return m[1];
    return /^[A-Za-z0-9]{22,128}$/.test(v) ? v : null;
  }
  function nodeIdFromLink(v) {
    const m = String(v || "").match(/node-id=(\d+)[-:](\d+)/);
    if (m) return m[1] + ":" + m[2];
    const n = String(v || "").trim().match(/^(\d+)[-:](\d+)$/);
    return n ? n[1] + ":" + n[2] : null;
  }
  const figmaLink = (id) => "https://www.figma.com/design/" + fileKey() + "/?node-id=" + String(id).replace(":", "-");
  function toast(text, err) {
    $("#toast").hidden = !text; $("#toastText").textContent = text || "";
    $("#toast").className = "toast" + (err ? " err" : "");
  }
  function errText(e) {
    const s = e && e.server ? e.server : "连接器";
    switch (e && e.code) {
      case "needs_reauth": return `${s} 的登录已过期：在 claude.ai 设置 → 连接器 里重新连接 ${s}，再点运行。`;
      case "server_not_connected": return `还没有连接 ${s}：在 claude.ai 设置 → 连接器 里添加 ${s}。`;
      case "selection_required": return `你有多个叫 ${s} 的连接器，请在弹出的提示里选一个。`;
      case "not_in_manifest": return `这个页面没有获准使用 ${s}，可以在页面的权限设置里打开。`;
      case "approval_required": return `需要你允许这个页面使用 ${s}，再点一次运行即可。`;
      case "blocked_by_policy": return `组织策略禁止在这里使用 ${s} 的这个功能。`;
      case "server_unavailable": return `${s} 暂时没有响应，稍后再试。`;
      case "tool_error": return `${s} 报错：${(e.message || "").slice(0, 400)}`;
      case "not_granted": case "capability_disabled": case "capability_removed": return "这个视图里用不了连接器或 Claude，请在 claude.ai 里打开这个页面。";
      case "rate_limited": return "调用太频繁，等几秒再试。";
      case "invalid_json": return "Claude 返回的格式不对，再运行一次试试。";
      case "cancelled": return "已取消。";
      default: return (e && e.message) ? String(e.message).slice(0, 400) : String(e);
    }
  }
  function parseLoose(t) {
    try { return JSON.parse(t); } catch {}
    const i = t.search(/[\[{]/); if (i < 0) return t;
    const j = t.lastIndexOf(t[i] === "[" ? "]" : "}");
    if (j > i) { try { return JSON.parse(t.slice(i, j + 1)); } catch {} }
    return t;
  }
  // 连接器是异步就绪的：调用时先等它，而不是立刻判失败
  let mcpReadyResolve; const mcpReady = new Promise((r) => (mcpReadyResolve = r));
  async function call(server, tool, input, retried) {
    if (!mcp) await Promise.race([mcpReady, new Promise((r) => setTimeout(r, 12000))]);
    if (!mcp) throw { code: "not_granted", server, message: "" };
    let res;
    try { res = await mcp.callTool(server, tool, input, { cache: false }); }
    catch (e) {
      // 只对读取类调用、且平台标为可重试的错误自动重试一次
      const read = server !== "Figma";
      if (read && !retried && e && e.retryable) {
        await new Promise((r) => setTimeout(r, (e.retryAfterMs || 800) + Math.random() * 400));
        return call(server, tool, input, true);
      }
      if (e && typeof e === "object") { e.server = e.server || server; e.tool = tool; }
      throw e;
    }
    let p = res.payload;
    if (typeof p === "string") p = parseLoose(p);
    if (p && typeof p === "object" && !Array.isArray(p) && p.result && typeof p.result === "object" && !("nodeId" in p) && !("bannerId" in p) && !("fields" in p)) p = p.result;
    const content = res.content || [];
    const tb = content.find((c) => c && c.type === "text" && typeof c.text === "string");
    const alt = tb ? parseLoose(tb.text) : null;
    return { payload: p, alt, content };
  }
  const clampDim = (v, d) => { const n = Math.round(Number(v)); return n >= 64 && n <= 4096 ? n : d; };
  const fitGen = (w, h) => { const s = Math.min(1, 2048 / Math.max(w, h)); return { width: Math.max(64, Math.round(w * s)), height: Math.max(64, Math.round(h * s)) }; };

  // ---------- 节点 ----------
  function defaults(type, d) {
    return Object.assign({}, {
      board: {},
      jira: { key: "" },
      split: { raw: "", style: "" },
      prompt: { prompt: "", title: "", subtitle: "", layout: "", width: 1600, height: 900, feedback: "", coco: false },
      image: { model: MODELS[0], count: 1, results: [], sel: 0 },
      compose: { template: "", replaceText: true },
    }[type], d);
  }
  function addNode(type, x, y, data = {}, quiet) {
    const n = { id: uid("n"), type, x: Math.round(x), y: Math.round(y), name: TYPES[type].label, data: defaults(type, data), out: null, status: "idle", error: "" };
    S.nodes.push(n); mountNode(n);
    if (!quiet) { save(); snapshot(true); }
    return n;
  }
  function connect(from, to, quiet) {
    if (from === to) return;
    const f = byId(from), t = byId(to);
    if (!f || !t || !TYPES[t.type].input) return;
    S.edges = S.edges.filter((e) => e.to !== to);
    S.edges.push({ id: uid("e"), from, to });
    markStale(t); drawEdges();
    if (!quiet) { save(); snapshot(true); }
  }
  function removeNode(n) {
    if (busy) return;
    S.nodes = S.nodes.filter((x) => x !== n);
    S.edges = S.edges.filter((e) => e.from !== n.id && e.to !== n.id);
    const el = els.get(n.id); if (el) { ro.unobserve(el.root); el.root.remove(); } els.delete(n.id);
    if (selNode === n.id) selNode = null; selSet.delete(n.id);
    drawEdges(); save(); snapshot(true);
  }
  // 一次删除多张卡片（只记一次撤销）
  function removeMany(ids) {
    const set = new Set(ids);
    for (const id of set) { const el = els.get(id); if (el) { ro.unobserve(el.root); el.root.remove(); } els.delete(id); selSet.delete(id); }
    S.nodes = S.nodes.filter((x) => !set.has(x.id));
    S.edges = S.edges.filter((e) => !set.has(e.from) && !set.has(e.to));
    if (set.has(selNode)) selNode = null;
    paintSel(); drawEdges(); save(); snapshot(true);
  }
  // 工单组是否已全部完成：有合成卡片，且每张都已合成
  function groupDone(j) {
    const cps = branchOf(j).filter((m) => m.type === "compose" && !m.data.orphan);
    return cps.length > 0 && cps.every((m) => m.status === "done" && m.out && m.out.bannerId);
  }
  // 清理前把已完成工单的成品记下来，看板上仍能看到“已完成”并打开 Figma 成品
  const ARCHKEY = "coco-done-archive-v1";
  const ARCH = load(ARCHKEY) || {};
  function archiveGroup(j) {
    const key = jiraKeyOf(j); if (!key) return;
    const banners = branchOf(j).filter((m) => m.type === "compose" && m.out && m.out.bannerId).map((m) => ({ id: m.out.bannerId, name: (ups(ups(m)[0] || {})[0] || {}).name || m.name }));
    ARCH[key] = { at: Date.now(), title: j.name, banners };
    store(ARCHKEY, ARCH);
  }
  async function cleanup(ids, how) {
    if (busy) { toast("正在运行，完成后再清理", true); return; }
    const nodes = [...new Set(ids)].map(byId).filter((n) => n && n.type !== "board");
    if (!nodes.length) { toast(how === "done" ? "没有已完成的工单可以清理" : "所选里没有可以清理的卡片"); return; }
    const jiras = nodes.filter((n) => n.type === "jira");
    const done = jiras.filter(groupDone), unfinished = jiras.filter((j) => !groupDone(j));
    const banners = done.reduce((a, j) => a + branchOf(j).filter((m) => m.type === "compose" && m.status === "done").length, 0);
    const lines = [
      `将从画布上移除 ${nodes.length} 张卡片` + (jiras.length ? `，涉及 ${jiras.length} 个工单` : "") + "。",
      done.length ? `其中 ${done.length} 个已完成（${banners} 张 Banner），会记录在看板里，随时可以打开成品。` : "",
      unfinished.length ? `注意：${unfinished.length} 个工单还没完成：${unfinished.map((j) => jiraKeyOf(j) || j.name).slice(0, 4).join("、")}${unfinished.length > 4 ? " 等" : ""}。` : "",
      "Figma 里已经生成的图和 Banner 不会被删除；清理后可以撤销（⌘Z）。",
    ].filter(Boolean);
    const ok = await askConfirm(how === "done" ? "清理已完成的工单" : "清理所选卡片", lines, `清理 ${nodes.length} 张卡片`);
    if (!ok) return;
    for (const j of done) archiveGroup(j);
    removeMany(nodes.map((n) => n.id));
    renderBoards();
    toast(`已清理 ${nodes.length} 张卡片` + (done.length ? `，${done.length} 个已完成工单已记录在看板` : "") + "。可撤销");
    requestAnimationFrame(() => { relieveOverlap(); });
  }
  function cleanupDone() {
    const jiras = S.nodes.filter((n) => n.type === "jira" && groupDone(n));
    const ids = jiras.flatMap((j) => branchOf(j).filter((m) => m.type !== "board").map((m) => m.id));
    if (ids.length) selectMany(ids);
    cleanup(ids, "done");
  }
  // 页面内确认弹窗（不依赖浏览器原生 confirm）
  function askConfirm(title, lines, okLabel) {
    return new Promise((resolve) => {
      const close = (v) => { wrap.remove(); document.removeEventListener("keydown", onKey, true); resolve(v); };
      const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(false); } if (e.key === "Enter") { e.stopPropagation(); close(true); } };
      const okBtn = h("button", { class: "btn primary danger", onclick: () => close(true) }, okLabel || "确定");
      const wrap = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title, onclick: (e) => { if (e.target === wrap) close(false); } },
        h("div", { class: "mbox" }, h("h3", {}, title), lines.map((l) => h("p", {}, l)),
          h("div", { class: "mact" }, h("button", { class: "btn", onclick: () => close(false) }, "取消"), okBtn)));
      document.body.append(wrap);
      document.addEventListener("keydown", onKey, true);
      okBtn.focus();
    });
  }
  function markStale(n, seen = new Set()) {
    if (seen.has(n.id)) return; seen.add(n.id);
    // 已固定的生成图不受上游改动影响（改文案只需重新合成，不再花生图额度）
    if (n.status === "done" && !isPinned(n)) { n.status = "stale"; paint(n); }
    for (const d of downs(n)) markStale(d, seen);
  }
  const SUBLINE_HINT = "\u0000";
  const isPinned = (n) => n.type === "image" && !!n.data.pinned && (n.data.results || []).length > 0;
  // 多选：selSet 是当前选中的卡片；selNode 是最后点中的那张（提示词库等单选功能用它）
  const selSet = new Set();
  function paintSel() { for (const [nid, el] of els) el.root.classList.toggle("sel", selSet.has(nid)); refreshAlignBar(); }
  function select(id) { selSet.clear(); if (id) selSet.add(id); selNode = id; paintSel(); }
  function selectMany(ids, add) { if (!add) selSet.clear(); for (const id of ids) selSet.add(id); selNode = ids.length ? ids[ids.length - 1] : selNode; paintSel(); }
  function toggleSel(id) { selSet.has(id) ? selSet.delete(id) : selSet.add(id); selNode = selSet.has(id) ? id : [...selSet].pop() || null; paintSel(); }

  function field(n, key, label, kind = "text", opts = {}) {
    let input;
    if (kind === "textarea") input = h("textarea", { rows: opts.rows || 4, placeholder: opts.placeholder || "" });
    else if (kind === "select") input = h("select", {}, (opts.options || []).map((o) => h("option", { value: o }, o)));
    else input = h("input", { type: kind, placeholder: opts.placeholder || "", min: opts.min, max: opts.max });
    input.value = n.data[key] ?? "";
    input.dataset.key = key;
    input.addEventListener(kind === "select" ? "change" : "input", () => {
      n.data[key] = kind === "number" ? Number(input.value) : input.value;
      if (n.status === "done") { n.status = "stale"; paint(n); }
      else if (n.status === "error") { n.status = "idle"; n.error = ""; paint(n); }
      for (const d of downs(n)) markStale(d);
      save(); snapshot();
    });
    return h("label", { class: "f" }, h("span", {}, label), input);
  }

  function bodyFor(n) {
    const b = h("div", { class: "body" });
    if (n.type === "board") { b.append(h("div", { class: "board" })); return b; }
    if (n.type === "jira") {
      b.append(jiraPicker(n));
    } else if (n.type === "split") {
      b.append(field(n, "raw", "需求文字（上游没有 Jira 节点时使用）", "textarea", { rows: 3, placeholder: "也可以直接粘贴需求" }));
      b.append(field(n, "style", "品牌与风格补充（可选）", "textarea", { rows: 2, placeholder: "例如：黑底霓虹绿，参考现有活动 Banner" }));
      b.append(refBox(n, "整体参考图（可选，拆解时让 Claude 参考）"));

  async function runChain(j, item) {

  const COCO_RE = /coco|可可|ip\s*形象|吉祥物|角色/i;
  function cocoBlob() {
    const b64 = COCO_IMG.split(",")[1]; const bin = atob(b64); const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], { type: "image/jpeg" });
  }
  // 生图最终提示词：用到 Coco 时附上固定外观，并放开“COCO”字样的限制
  function finalPrompt(out) {
    if (!out.coco) return out.prompt;
    const base = String(out.prompt).replace(/No text, no letters, no numbers, no logos, no watermark\.?/i, "No other text, no numbers, no logos, no watermark.");
    return base + "\n\n" + COCO_SPEC;
  }

  // ---------- 自动化 ----------
  const AUTOKEY = "coco-auto-v1";
  const AUTO = Object.assign({ refresh: true, autoSplit: true, autoGen: false, cap: 10, tidy: true, retry: true, lastTick: 0 }, load(AUTOKEY) || {});
  const saveAuto = () => store(AUTOKEY, AUTO);
  // 我负责的、还没开始做的工单（不在画布上、没完成过、Jira 状态未完成）
  const todoMine = () => J.issues.filter((x) => isMine(x) && x.cat !== "done" && !flowFor(x.key) && !ARCH[x.key]);
  function autoPick(all) {
    if (!AUTO.autoSplit && !all) return;
    const keys = all ? todoMine().map((x) => x.key) : todoMine().filter((x) => (J.fresh || []).includes(x.key)).map((x) => x.key);
    if (!keys.length) { if (all) toast("没有待处理的我负责的工单"); return; }
    if (AUTO.autoGen && !fileKey()) { toast("自动生图需要先在顶栏填 Figma 文件链接，这次只做拆解", true); }
    toast(`自动处理 ${keys.length} 个我负责的工单：` + (AUTO.autoGen && fileKey() ? `拆解并生图（本轮最多 ${AUTO.cap} 次）` : "只拆解，生图等你确认"));
    generateFor(keys, { full: !!(AUTO.autoGen && fileKey()), auto: true });
  }
  function autoTick() {
    AUTO.lastTick = Date.now(); saveAuto(); renderAuto();
    if (!AUTO.refresh || busy || !mcp || document.hidden) return;
    if (!J.loadedAt || Date.now() - J.loadedAt >= 10 * 60 * 1000) guardBoard();
  }
  setInterval(autoTick, 60 * 1000);
  function renderAuto() {
    const box = $("#autoPanel"); if (!box || box.hidden) return;
    const sw = (key, label, hint) => {
      const cb = h("input", { type: "checkbox" }); cb.checked = !!AUTO[key];
      cb.addEventListener("change", () => { AUTO[key] = cb.checked; saveAuto(); renderAuto(); });
      return h("label", { class: "arow" }, cb, h("span", {}, h("b", {}, label), hint ? h("small", {}, hint) : null));
    };
    const cap = h("input", { type: "number", min: 0, max: 100, value: AUTO.cap, class: "acap", "aria-label": "每轮自动生图上限" });
    cap.addEventListener("change", () => { AUTO.cap = Math.max(0, Math.min(100, Number(cap.value) || 0)); saveAuto(); });
    const next = J.loadedAt ? new Date(J.loadedAt + 10 * 60 * 1000) : null;
    box.replaceChildren(
      h("h3", {}, h("span", {}, "自动化"), h("button", { class: "icon-btn", "aria-label": "关闭", html: svg("close"), onclick: () => (box.hidden = true) })),
      h("p", {}, "页面开着时自动运行。生图会消耗额度，默认只自动拆解。"),
      sw("refresh", "每 10 分钟自动刷新 Jira 看板", next ? `下次约 ${next.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}` : ""),
      sw("autoSplit", "发现我负责的新工单时，自动建流程并拆解", "不生图，拆好等你确认"),
      sw("autoGen", "拆解后自动生图并合成", "会消耗 Figma AI 额度"),
      AUTO.autoGen ? h("label", { class: "arow sub" }, h("span", {}, "每轮最多自动生图"), cap, h("span", {}, "次，超出的等你确认")) : null,
      sw("tidy", "每轮跑完自动整理画布"),
      sw("retry", "临时出错时自动重试 1 次"),
      h("div", { class: "arow info" }, h("span", {}, h("b", {}, "Coco 改图"), h("small", {}, "在 Figma 里改好后，页面每 20 秒检测一次并自动继续合成；改图这一步可以在对话里让 Claude 代你在浏览器完成。"))),
      h("div", { class: "acts" },
        h("button", { class: "btn primary", disabled: busy, onclick: () => { box.hidden = true; autoPick(true); } }, `立即处理我负责的未开始工单（${todoMine().length}）`)));

  const cocoMode = () => (S.cocoMode || "edit");

  function editPromptFor(out) {
    const scene = String(out.prompt || "").replace(/No (other )?text,( no letters,)?( no numbers,)? no logos, no watermark\.?/i, "").trim();
    return "保持 Coco 的五官（金色大眼睛、吻部、鼻孔、小白牙）、红色皮肤、背刺、尾巴和整体身体比例完全不变，不要变形。"
      + "只按下面的要求修改姿势、服装和背景：\n" + scene
      + `\n画面比例 ${out.width}:${out.height}；除衣服上的文字外，不要出现其他文字。`;
  }
  async function cocoEdit(n, up, fk) {
    const ed = n.data.edit;
    if (ed && ed.nodeId && !ed.consumed) {
      const { payload } = await call("Figma", "use_figma", { fileKey: fk, description: "检查 Coco 改图是否完成", code: EDIT_CHECK_CODE.replace("__ID__", JSON.stringify(ed.nodeId)) });
      const r = payload && typeof payload === "object" ? payload : {};
      if (!r.exists) { n.data.edit = null; throw new Error("找不到这张 Coco 改图图层（可能被删除了）：再运行一次会重新复制"); }
      const changed = (r.hashes || []).join() !== (ed.hashes || []).join();
      if (!changed) { if (n.data.editCheck) { n.data.editCheck = false; toast("这张图看起来还没改：请先在 Figma 里选中它，用「改图」生成后再点继续", true); } throw { code: "waiting_edit" }; }
      ed.consumed = true;
      n.data.results = [{ nodeId: ed.nodeId, thumb: "", ratio: "" }]; n.data.sel = 0;
      return Object.assign({}, up.out, { imageNodeId: ed.nodeId, edited: true });
    }
    const name = "Coco 改图 · " + (jiraKeyOf(n) ? jiraKeyOf(n) + " · " : "") + (up.out.name || "Banner");
    const { payload } = await call("Figma", "use_figma", { fileKey: fk, description: "复制 Coco 母版图层用于改图", code: EDIT_CLONE_CODE.replace("__PARAMS__", JSON.stringify({ masterId: cocoMaster(), targetNodeId: nodeIdFromLink(S.file), name, prompt: editPromptFor(up.out), ratio: (up.out.width || 3) / (up.out.height || 4) })) });
    const r = payload && typeof payload === "object" ? payload : {};
    if (!r.nodeId) throw new Error("没能复制 Coco 母版图层：" + JSON.stringify(payload).slice(0, 200));
    n.data.edit = { nodeId: r.nodeId, hashes: r.hashes || [], prompt: editPromptFor(up.out), consumed: false };
    toast("已在 Figma 里复制好 Coco 图层：选中它，用「改图」粘贴提示词生成");
    throw { code: "waiting_edit" };
  }
  const EDIT_CLONE_CODE = `
const P = __PARAMS__;
const master = await figma.getNodeByIdAsync(P.masterId);
if (!master) throw new Error("找不到 Coco 母版图层 " + P.masterId);
let mp = master; while (mp.type !== "PAGE") mp = mp.parent;
let tp = mp;
if (P.targetNodeId) { let t = await figma.getNodeByIdAsync(P.targetNodeId); while (t && t.type !== "PAGE") t = t.parent; if (t) tp = t; }
await figma.setCurrentPageAsync(tp);
const c = master.clone(); tp.appendChild(c);
let maxX = 0, minY = Infinity;
for (const k of tp.children) if (k !== c) { maxX = Math.max(maxX, k.x + k.width); minY = Math.min(minY, k.y); }
c.name = P.name;
if (P.ratio && P.ratio > 0) {
  const nw = P.ratio >= 1 ? Math.round(1100 * P.ratio) : Math.round(1356 * P.ratio), nh = P.ratio >= 1 ? 1100 : 1356;
  if ("fills" in c && Array.isArray(c.fills)) c.fills = c.fills.map((f) => f.type === "IMAGE" ? Object.assign({}, f, { scaleMode: "FIT" }) : f);
  c.resize(nw, nh);
}
c.x = maxX + 200; c.y = minY === Infinity ? 0 : minY;
const hashes = ("fills" in c && Array.isArray(c.fills)) ? c.fills.filter((f) => f.type === "IMAGE").map((f) => f.imageHash) : [];
let font = { family: "Inter", style: "Regular" };
try { await figma.loadFontAsync({ family: "Noto Sans SC", style: "Regular" }); font = { family: "Noto Sans SC", style: "Regular" }; } catch (e) { await figma.loadFontAsync(font); }
const t = figma.createText(); t.fontName = font; t.fontSize = 22; t.characters = P.prompt;
t.fills = [{ type: "SOLID", color: { r: 0.55, g: 0.55, b: 0.6 } }];
t.name = "改图提示词 · " + c.id; tp.appendChild(t);
t.x = c.x; t.y = c.y + c.height + 40; t.resize(c.width, t.height); t.textAutoResize = "HEIGHT";
return { nodeId: c.id, hashes, promptNodeId: t.id };
`;
  const EDIT_CHECK_CODE = `
const n = await figma.getNodeByIdAsync(__ID__);
if (!n || n.removed) return { exists: false };
const hashes = ("fills" in n && Array.isArray(n.fills)) ? n.fills.filter((f) => f.type === "IMAGE").map((f) => f.imageHash) : [];
return { exists: true, hashes };
`;
  let pollT = 0, polling = false;
  async function pollEdits() {
    if (busy || polling || !mcp || document.hidden) return;
    const w = S.nodes.filter((x) => x.type === "image" && x.status === "waiting" && x.data.edit && x.data.edit.nodeId && !x.data.edit.consumed);
    if (!w.length) return;
    polling = true;
    try {
      const fk = fileKey(); if (!fk) return;
      const { payload } = await call("Figma", "use_figma", { fileKey: fk, description: "检查 Coco 改图是否完成", code: EDIT_CHECK_MANY_CODE.replace("__IDS__", JSON.stringify(w.map((x) => x.data.edit.nodeId))) });
      const map = (payload && payload.results) || {};
      const doneOnes = w.filter((x) => map[x.data.edit.nodeId] && (map[x.data.edit.nodeId] || []).join() !== (x.data.edit.hashes || []).join());
      if (doneOnes.length && !busy) {
        toast(`检测到 ${doneOnes.length} 张 Coco 图已在 Figma 里改好，正在继续合成`);
        guard(async () => { for (const n of doneOnes) { await exec(n); if (n.status === "done") for (const cp of downs(n)) await exec(cp); } });
      }
    } catch { /* 下次再查 */ } finally { polling = false; }
  }
  pollT = setInterval(pollEdits, 20000);
  const EDIT_CHECK_MANY_CODE = `
const ids = __IDS__; const results = {};
for (const id of ids) { const n = await figma.getNodeByIdAsync(id); results[id] = (n && !n.removed && "fills" in n && Array.isArray(n.fills)) ? n.fills.filter((f) => f.type === "IMAGE").map((f) => f.imageHash) : null; }
return { results };
`;
  async function fixMisrouted() {
    const bad = S.nodes.filter((x) => x.type === "image" && x.status === "waiting" && x.data.edit && !ups(x).some((p) => p.type === "prompt" && /coco/i.test(String(p.data.prompt))));
    if (!bad.length) return;
    const ids = [];
    for (const n of bad) {
      ids.push(n.data.edit.nodeId);
      n.data.edit = null; n.status = "idle"; n.error = "";
      for (const p of ups(n)) if (p.type === "prompt") { p.data.coco = false; remount(p); }
      paint(n);
    }
    save(); snapshot(true); refreshPanels();
    toast(`${bad.length} 张图的场景里没有 Coco，已改回普通生图：在右侧确认后生成`);
    const fk = fileKey(); if (!fk || !mcp) return;
    try { await call("Figma", "use_figma", { fileKey: fk, description: "清理误建的 Coco 改图图层", code: EDIT_REMOVE_CODE.replace("__IDS__", JSON.stringify(ids)) }); } catch { /* 图层可能已被删除 */ }
  }
  const EDIT_REMOVE_CODE = `
const ids = __IDS__; let removed = 0;
for (const id of ids) {
  const c = await figma.getNodeByIdAsync(id); if (!c) continue;
  let p = c; while (p && p.type !== "PAGE") p = p.parent;
  if (p) { await p.loadAsync(); const t = p.children.find((n) => n.type === "TEXT" && n.name === "改图提示词 · " + id); if (t) t.remove(); }
  c.remove(); removed++;
}
return { removed };
`;
  function editPanel(n) {
    const ed = n.data.edit || {};
    const box = h("div", { class: "editbox" });
    const ta = h("textarea", { class: "editprompt", rows: 6, readonly: true, "aria-label": "改图提示词" }); ta.value = ed.prompt || "";
    const copy = h("button", { class: "chipbtn", onclick: async () => { try { await navigator.clipboard.writeText(ta.value); toast("改图提示词已复制"); } catch { ta.select(); toast("请手动复制选中的提示词"); } } }, "复制改图提示词");
    box.append(
      h("div", { class: "etitle" }, "在 Figma 里改 Coco 图"),
      h("ol", {},
        h("li", {}, "打开 Figma，选中图层「", h("b", {}, "Coco 改图 · …"), "」（提示词也放在它下方）"),
        h("li", {}, "点「Edit with prompt / 使用提示编辑」，粘贴下面的提示词，生成"),
        h("li", {}, "改好后这里会自动继续合成，也可以手动点「我已改好，继续」")),
      h("div", { class: "ehint" }, "不想自己点？在和 Claude 的对话里说「帮我改 Coco 图」，Claude 会在你的浏览器里打开 Figma 替你完成改图。"),
      ta,
      h("div", { class: "acts" }, copy,
        ed.nodeId ? h("a", { class: "chipbtn", href: figmaLink(ed.nodeId), target: "_blank", rel: "noopener" }, "在 Figma 中打开 ↗") : null,
        h("button", { class: "chipbtn primary-chip", onclick: () => { n.data.editCheck = true; runFrom(n); } }, "我已改好，继续")));
    return box;
  }

  // ---------- 参考图 ----------
  const REFKEY = "coco-ref-images-v1";
  const REFS = load(REFKEY) || {};
  let imgCaps = null;
  const ROLES = ["风格", "配色", "构图", "场景", "角色"];
  const refsOf = (n) => (n.data.refs || []).filter((r) => REFS[r.id]);
  const refNote = (refs) => refs.map((r, i) => `第 ${i + 1} 张参考${r.role}`).join("，");
  function refBlobs(refs) {
    return refs.map((r) => {
      const [head, b64] = REFS[r.id].split(",");
      const mime = (head.match(/data:([^;]+)/) || [])[1] || "image/jpeg";
      const bin = atob(b64); const a = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
      return new Blob([a], { type: mime });
    });
  }
  async function shrink(file) {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 640 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.82);
  }
  function saveRefs() {
    const used = new Set(S.nodes.flatMap((n) => (n.data.refs || []).map((r) => r.id)));
    for (const k of Object.keys(REFS)) if (!used.has(k)) delete REFS[k];
    try { localStorage.setItem(REFKEY, JSON.stringify(REFS)); } catch { toast("参考图太多，本地存不下了：本次可以用，刷新后可能丢失", true); }
  }
  function refBox(n, label) {
    const wrap = h("div", { class: "f refs" }); wrap.dataset.refs = n.id;
    fillRefs(n, wrap, label); return wrap;
  }
  function fillRefs(n, wrap, label) {
    const refs = refsOf(n);
    const max = imgCaps ? Math.min(imgCaps.maxCount || 4, 6) : 4;
    const input = h("input", { type: "file", multiple: true, accept: imgCaps && imgCaps.mediaTypes ? imgCaps.mediaTypes.join(",") : "image/png,image/jpeg,image/webp", hidden: true });
    const addBlobs = async (blobs, src) => {
      const room = Math.max(0, max - refs.length);
      if (!room) { toast(`最多 ${max} 张参考图`, true); return; }
      let added = 0;
      for (const f of blobs.slice(0, room)) {
        try { const id = "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); REFS[id] = await shrink(f); refs.push({ id, role: ROLES[0], src: src || "" }); added++; }
        catch { toast("有一张图片读不出来，换成 PNG 或 JPG 试试", true); }
      }
      if (!added) return;
      n.data.refs = refs.map((r) => ({ id: r.id, role: r.role, src: r.src || "" }));
      afterRefChange(n, wrap, label);
      toast(`已添加 ${added} 张参考图`);
    };
    input.addEventListener("change", () => addBlobs([...input.files]));
    // 链接：Figma 图层链接自动读取；data: 图片直接使用；普通网页链接受页面安全限制，引导复制粘贴
    const linkInp = h("input", { class: "reflink", type: "url", placeholder: "粘贴图片链接（Figma 图层链接 / 网页图片）", "aria-label": "参考图链接" });
    const addLink = async () => {
      const url = linkInp.value.trim(); if (!url) return;
      const btn = linkBtn; btn.disabled = true; btn.textContent = "读取中…";
      try {
        const blob = await blobFromLink(url);
        if (blob) { linkInp.value = ""; await addBlobs([blob], url); }
      } catch (e) { toast(errText(e), true); }
      finally { btn.disabled = false; btn.textContent = "添加链接"; }
    };
    linkInp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addLink(); } });
    const linkBtn = h("button", { class: "chipbtn", onclick: addLink }, "添加链接");
    // 直接粘贴（⌘V）或拖入图片
    wrap.onpaste = (e) => {
      const files = [...(e.clipboardData ? e.clipboardData.files : [])].filter((f) => /^image\//.test(f.type));
      if (files.length) { e.preventDefault(); addBlobs(files); return; }
      const text = e.clipboardData && e.clipboardData.getData("text");
      if (text && /^(https?:|data:image)/.test(text.trim()) && e.target !== linkInp) { e.preventDefault(); linkInp.value = text.trim(); addLink(); }
    };
    wrap.ondragover = (e) => { e.preventDefault(); wrap.classList.add("drop"); };
    wrap.ondragleave = () => wrap.classList.remove("drop");
    wrap.ondrop = (e) => {
      e.preventDefault(); wrap.classList.remove("drop");
      const files = [...(e.dataTransfer ? e.dataTransfer.files : [])].filter((f) => /^image\//.test(f.type));
      if (files.length) { addBlobs(files); return; }
      const url = e.dataTransfer && (e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text"));
      if (url) { linkInp.value = url.split("\n")[0].trim(); addLink(); }
    };
    const grid = h("div", { class: "refgrid" }, refs.map((r, i) => {
      const sel = h("select", { "aria-label": "参考用途" }, ROLES.map((x) => h("option", { value: x }, x))); sel.value = r.role;
      sel.addEventListener("change", () => { r.role = sel.value; n.data.refs = refs.map((x) => ({ id: x.id, role: x.role, src: x.src || "" })); afterRefChange(n, wrap, label, true); });
      return h("div", { class: "ref" }, h("img", { src: REFS[r.id], alt: `参考图 ${i + 1}` }),
        h("button", { class: "rm", "aria-label": "移除参考图", html: svg("close"), onclick: () => { refs.splice(i, 1); n.data.refs = refs.map((x) => ({ id: x.id, role: x.role })); afterRefChange(n, wrap, label); } }),
        sel);
    }));
    const add = h("button", { class: "chipbtn", disabled: refs.length >= max, onclick: () => input.click() }, refs.length ? `添加参考图（${refs.length}/${max}）` : "添加参考图");
    wrap.replaceChildren(...[h("span", {}, label), refs.length ? grid : null,
      h("div", { class: "linkrow" }, linkInp, linkBtn),
      h("div", { class: "acts" }, add,
      sample && !imgCaps ? h("span", { class: "refnote" }, "这个视图不能向 Claude 发送图片") : h("span", { class: "refnote" }, "Figma 生图只接受文字，参考图会由 Claude 转成具体的画面描述")), input].filter(Boolean));
  }
  // 把链接变成图片：Figma 图层用连接器导出；data: 直接解码；网页图片受页面安全限制无法下载
  async function blobFromLink(url) {
    if (/^data:image\//.test(url)) {
      const [head, b64] = url.split(","); const mime = (head.match(/data:([^;]+)/) || [])[1] || "image/png";
      const bin = atob(b64); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
      return new Blob([a], { type: mime });
    }
    const fm = url.match(/figma\.com\/(?:design|file|board|slides)\/(?:[^/]+\/branch\/)?([A-Za-z0-9]{22,128})/);
    if (fm) {
      const nid = nodeIdFromLink(url);
      if (!nid) throw new Error("Figma 链接里没有 node-id：在 Figma 里右键图层 → 复制链接（Copy link to selection）");
      const { payload } = await call("Figma", "use_figma", { fileKey: fm[1], description: "导出图层作为参考图", code: REF_EXPORT_CODE.replace("__ID__", JSON.stringify(nid)) });
      const r = payload && typeof payload === "object" ? payload : {};
      if (!r.b64) throw new Error("没能读取这个 Figma 图层：" + (r.error || "请确认链接正确、你有这个文件的访问权限"));
      const bin = atob(r.b64); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
      toast(`已从 Figma 读取「${r.name}」`);
      return new Blob([a], { type: "image/jpeg" });
    }
    if (/^https?:\/\//.test(url)) {
      throw new Error("网页图片链接受页面安全限制无法直接下载：请在网页上右键图片 →「复制图片」，然后在这里按 ⌘V（Ctrl+V）粘贴；或者先把图片放进 Figma，再粘贴图层链接");
    }
    throw new Error("这不是有效的图片链接");
  }
  const REF_EXPORT_CODE = `
const n = await figma.getNodeByIdAsync(__ID__);
if (!n || !("exportAsync" in n)) return { error: "找不到这个图层" };
let p = n; while (p && p.type !== "PAGE") p = p.parent;
const bytes = await n.exportAsync({ format: "JPG", constraint: { type: "WIDTH", value: Math.min(800, Math.max(64, Math.round(n.width))) } });
return { b64: figma.base64Encode(bytes), name: n.name, page: p ? p.name : "" };
`;
  function afterRefChange(n, wrap, label, keepDom) {
    if (n.status === "done") { n.status = "stale"; paint(n); }
    for (const d of downs(n)) markStale(d);
    saveRefs(); save(); snapshot(true);
    if (!keepDom) fillRefs(n, wrap, label);
  }
  function refreshRefBoxes() {
    for (const n of S.nodes) { const el = els.get(n.id); const w = el && el.root.querySelector("[data-refs]"); if (w) fillRefs(n, w, w.firstChild ? w.firstChild.textContent : "参考图"); }
  }
  // ---------- 启动 ----------
  for (const n of S.nodes) { if (n.status === "running") n.status = "idle"; mountNode(n); }
  applyView();
  if (!S.nodes.length) starter();
  else {
    if (!S.nodes.some((n) => n.type === "board")) { const b0 = bounds(); addNode("board", (b0 ? b0.x1 : 0) - 700, b0 ? b0.y1 : 0, {}, true); save(); }
    requestAnimationFrame(() => { relieveOverlap(); drawEdges(); fit(); });
  }
  lastSnap = JSON.stringify(S);
  refreshUndo(); refreshPanels(); refreshStart();
  window.addEventListener("resize", drawMini);

  (async () => {
    if (!window.claude || !window.claude.use) { toast("请在 claude.ai 里打开这个页面，才能连接 Jira、Figma 和 Claude。", true); return; }
    const [m, s] = await Promise.all([window.claude.use("mcp"), window.claude.use("sample")]);
    mcp = m; sample = s;
    mcpReadyResolve();
    fixMisrouted();
    if (sample && sample.limits) { try { const l = await sample.limits(); imgCaps = l && l.images ? l.images : null; } catch { imgCaps = null; } }
    refreshRefBoxes();
    renderBoards();
    // 只有已经授权过时才在打开页面时自动读取；第一次由你点按钮触发授权
    const stale = !J.loadedAt || Date.now() - J.loadedAt > 10 * 60 * 1000;
    if (mcp && stale && S.nodes.some((n) => n.type === "board")) {
      const st = await jiraPermState();
      if (st === "granted" || (st === "unknown" && J.loadedAt)) guardBoard();
    }
    if (!mcp) toast("这个视图里连不上 Jira 和 Figma 连接器：请在 claude.ai 里打开这个页面。", true);
    else if (!sample) toast("这个视图里用不了 Claude，需求拆解会把整段需求当作一张图。");
  })();
})();
</script>
</body>
